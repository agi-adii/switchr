<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#4f46e5" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base with Gradient -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bg-grad)" filter="url(#shadow)" />

  <!-- Inner Soft Border -->
  <rect x="33" y="33" width="446" height="446" rx="111" stroke="rgba(255,255,255,0.2)" stroke-width="2" />

  <!-- Dual Switch Arrows Symbol (Representing Universal Conversion) -->
  <g transform="translate(116, 116)" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Right Arrow -->
    <path d="M 40 70 L 220 70 L 175 25" />
    <!-- Bottom Left Arrow -->
    <path d="M 240 210 L 60 210 L 105 255" />
    
    <!-- Central Speed Sparks -->
    <circle cx="140" cy="140" r="14" fill="#38bdf8" stroke="none" />
  </g>
</svg>
